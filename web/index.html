<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问问 Agent · 网文数据分析</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1d212e;
    --border: #2a2f3f; --text: #e4e7ef; --dim: #8b93a7;
    --accent: #6c8cff; --accent2: #8b6cff; --ok: #4ade80; --warn: #fbbf24; --err: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px;
  }
  /* ---------- 侧栏 ---------- */
  aside {
    width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  aside h1 {
    font-size: 15px; padding: 16px 16px 8px; font-weight: 600;
  }
  aside h1 span { color: var(--accent); }
  aside .sub { padding: 0 16px 12px; color: var(--dim); font-size: 12px; }
  .new-chat {
    margin: 0 12px 12px; padding: 9px; border: 1px dashed var(--border); border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
    transition: border-color .15s;
  }
  .new-chat:hover { border-color: var(--accent); }
  #sessionList { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .session-item {
    padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--dim);
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .session-item:hover { background: var(--panel2); }
  .session-item.active { background: var(--panel2); color: var(--text); }
  .session-item .title { overflow: hidden; text-overflow: ellipsis; }
  .session-item .del {
    flex-shrink: 0; width: 20px; height: 20px; border: none; border-radius: 5px;
    background: transparent; color: var(--dim); cursor: pointer; font-size: 13px;
    display: none; align-items: center; justify-content: center; line-height: 1;
  }
  .session-item:hover .del { display: flex; }
  .session-item .del:hover { color: var(--err); background: rgba(248, 113, 113, .12); }
  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; justify-content: space-between;
  }
  header .title { font-weight: 600; font-size: 14px; }
  header .model {
    font-size: 12px; color: var(--dim); background: var(--panel2);
    padding: 3px 10px; border-radius: 99px;
  }
  #chat { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
  #chat .empty { color: var(--dim); text-align: center; margin-top: 18vh; line-height: 2; }
  #chat .empty code {
    background: var(--panel2); padding: 2px 8px; border-radius: 6px; cursor: pointer;
  }
  #chat .empty code:hover { color: var(--accent); }
  .msg { max-width: 780px; margin: 0 auto 18px; display: flex; gap: 10px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 2px;
  }
  .msg.user .avatar { background: var(--panel2); }
  .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .bubble { min-width: 0; }
  .msg.user .bubble { color: var(--dim); padding-top: 5px; }
  .msg.assistant .content {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .content.streaming::after {
    content: '▍'; color: var(--accent); animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* 工具调用时间线 */
  .tool-line {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim);
    margin: 0 0 8px 40px; animation: fadeIn .3s;
  }
  .tool-line .chip {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 8px; font-family: ui-monospace, monospace;
  }
  .tool-line .chip b { color: var(--accent); font-weight: 500; }
  .tool-line.error .chip b { color: var(--err); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } }
  /* ---------- 输入区 ---------- */
  footer { padding: 14px 20px 18px; }
  .input-wrap {
    max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px;
    transition: border-color .15s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font: inherit; line-height: 1.5; max-height: 120px;
  }
  textarea::placeholder { color: var(--dim); }
  button.send, button.stop {
    border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer;
    font-size: 13px; color: #fff; flex-shrink: 0;
  }
  button.send { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  button.send:disabled { opacity: .4; cursor: not-allowed; }
  button.stop { background: transparent; border: 1px solid var(--err); color: var(--err); display: none; }
  .hint { max-width: 780px; margin: 8px auto 0; text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>

<aside>
  <h1>问问 <span>Agent</span></h1>
  <div class="sub">网文数据分析助手</div>
  <button class="new-chat" id="newChatBtn">＋ 新对话</button>
  <div id="sessionList"></div>
</aside>

<main>
  <header>
    <div class="title" id="chatTitle">新对话</div>
    <div class="model">glm-4-flash · 128K</div>
  </header>

  <div id="chat">
    <div class="empty">
      试试问我：<br>
      <code data-q="看看第 1 到 8 章的数据，读者流失发生在哪里？">读者流失分析</code>
      <code data-q="哪一章完读率最低？给我改进建议">完读率诊断</code>
      <code data-q="帮我整体分析这本书的数据表现，出一份报告">生成报告</code>
    </div>
  </div>

  <footer>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="sendBtn">发送</button>
      <button class="stop" id="stopBtn">停止</button>
    </div>
    <div class="hint">AI 生成内容仅供参考 · 数据为本地 mock</div>
  </footer>
</main>

<script type="module">
const $ = (s) => document.querySelector(s);
const chatEl = $('#chat'), inputEl = $('#input'), sendBtn = $('#sendBtn'), stopBtn = $('#stopBtn');
let sessionId = null, busy = false, abortCtrl = null;

/* ---------- 会话管理 ---------- */
async function loadSessions() {
  const list = await (await fetch('/api/sessions')).json();
  $('#sessionList').innerHTML = list.map(s =>
    `<div class="session-item ${s.id === sessionId ? 'active' : ''}" data-id="${s.id}">
      <span class="title">${s.title}</span>
      <button class="del" data-id="${s.id}" title="删除对话">✕</button>
    </div>`
  ).join('');
}

async function newChat() {
  const { sessionId: id } = await (await fetch('/api/sessions', { method: 'POST' })).json();
  sessionId = id;
  $('#chatTitle').textContent = '新对话';
  chatEl.innerHTML = '<div class="empty">开始提问吧</div>';
  history.replaceState(null, '', `?s=${id}`);
  loadSessions();
}

async function openSession(id) {
  sessionId = id;
  const msgs = await (await fetch(`/api/sessions/${id}/messages`)).json();
  $('#chatTitle').textContent = $('.session-item[data-id="' + id + '"]')?.textContent || '对话';
  chatEl.innerHTML = '';
  // 历史消息都是已完成的回答，不加光标
  for (const m of msgs) addMessage(m.role, m.parts.find(p => p.type === 'text')?.text || '');
  scrollBottom();
  loadSessions();
}

/* ---------- 消息渲染 ---------- */
function emptyHint() { chatEl.querySelector('.empty')?.remove(); }
function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

function addMessage(role, text, streaming = false) {
  emptyHint();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '我' : '问'}</div>
    <div class="bubble"><div class="content ${streaming ? 'streaming' : ''}"></div></div>`;
  div.querySelector('.content').textContent = text;
  chatEl.appendChild(div);
  scrollBottom();
  return div.querySelector('.content');
}

function addToolLine(toolName, args, isError = false) {
  const div = document.createElement('div');
  div.className = 'tool-line' + (isError ? ' error' : '');
  div.innerHTML = `<span class="chip">🔧 <b>${toolName}</b></span><span class="args"></span>`;
  div.querySelector('.args').textContent = JSON.stringify(args);
  chatEl.appendChild(div);
  scrollBottom();
}

/* ---------- 发送 & SSE ---------- */
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  inputEl.value = '';
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'block';
  addMessage('user', text);
  const content = addMessage('assistant', '', true); // 仅本次回答带流式光标

  // 用户点停止 → 中断 fetch → 服务端感知断开 → abort 上游模型请求
  abortCtrl = new AbortController();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: text }),
      signal: abortCtrl.signal,
    });

    // 手动解析 SSE（fetch + ReadableStream，面试可以讲的细节：
    // EventSource 只支持 GET，带 body 的 POST 推流必须手动解析）
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // 最后一段可能不完整，留到下一轮
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const evt = JSON.parse(line.slice(5));
        if (evt.type === 'text-delta') {
          content.textContent += evt.text;
          scrollBottom();
        } else if (evt.type === 'tool-call') {
          addToolLine(evt.toolName, evt.args);
        } else if (evt.type === 'tool-error') {
          addToolLine(evt.toolName, evt.error, true);
        } else if (evt.type === 'error') {
          content.textContent += '\n\n❌ ' + evt.message;
        } else if (evt.type === 'done') {
          content.classList.remove('streaming'); // 回答结束，移除光标
        }
      }
    }
    content.classList.remove('streaming');
  } catch (e) {
    content.classList.remove('streaming');
    if (e.name !== 'AbortError') content.textContent += '\n\n❌ 连接中断';
  } finally {
    busy = false;
    abortCtrl = null;
    sendBtn.style.display = 'block';
    stopBtn.style.display = 'none';
    // 兜底：任何路径退出都清掉残留的流式光标
    document.querySelectorAll('.content.streaming').forEach((el) => el.classList.remove('streaming'));
    if ($('#chatTitle').textContent === '新对话') {
      $('#chatTitle').textContent = text.slice(0, 20);
      loadSessions();
    }
  }
}

/* ---------- 事件绑定 ---------- */
sendBtn.onclick = send;
stopBtn.onclick = () => abortCtrl?.abort();
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
$('#sessionList').onclick = async (e) => {
  // 删除按钮（阻止冒泡，不触发会话切换）
  if (e.target.matches('.del')) {
    e.stopPropagation();
    const id = e.target.dataset.id;
    if (!confirm('确定删除这个对话吗？')) return;
    await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
    if (id === sessionId) newChat();
    else loadSessions();
    return;
  }
  const item = e.target.closest('.session-item');
  if (item && !busy) openSession(item.dataset.id);
};
$('#newChatBtn').onclick = () => { if (!busy) newChat(); };
chatEl.onclick = (e) => {
  if (e.target.matches('.empty code')) { inputEl.value = e.target.dataset.q; inputEl.focus(); }
};

/* ---------- 初始化 ---------- */
const urlSession = new URLSearchParams(location.search).get('s');
urlSession ? openSession(urlSession) : newChat();
</script>
</body>
</html>
